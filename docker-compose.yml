services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cliniccare
      POSTGRES_USER: cliniccare
      POSTGRES_PASSWORD: cliniccare_dev_only
    ports:
      - "5432:5432"
    volumes:
      - cliniccare_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cliniccare"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  cliniccare_pg:
