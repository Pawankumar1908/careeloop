services:
  - type: web
    name: careloop-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: careloop-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: https://careloop-web-9jzh.onrender.com
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: WHATSAPP_REMINDER_TEMPLATE_NAME
        value: medication_reminder
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en_US
      - key: WHATSAPP_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: WHATSAPP_WEBHOOK_VERIFY_TOKEN
        generateValue: true

  - type: web
    runtime: static
    name: careloop-web
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
    routes:
      - type: rewrite
        source: /api/*
        destination: https://careloop-api-aiz6.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: careloop-db
    plan: free
    region: singapore
